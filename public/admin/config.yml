backend:
  name: github
  repo: JooYoung1121/blog_social
  branch: main
  base_url: https://jinas-holiday.vercel.app
  auth_endpoint: api/auth

locale: ko

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: false

collections:
  - name: posts
    label: 블로그 글
    label_singular: 글
    folder: src/content/posts
    nested:
      depth: 3
      summary: "{{title}} ({{date}})"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    meta: { path: { widget: string, label: 경로, index_file: "" } }
    sortable_fields: ["date", "title"]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 설명, name: description, widget: string }
      - { label: 날짜, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - label: 카테고리
        name: category
        widget: select
        options:
          - { label: 육아용품 리뷰, value: baby-products }
          - { label: 육아일기, value: parenting }
          - { label: 일상, value: daily-life }
          - { label: 맛집/요리, value: food }
          - { label: 여행/나들이, value: travel }
      - { label: 태그, name: tags, widget: list, default: [] }
      - { label: 썸네일, name: thumbnail, widget: image }
      - { label: 이미지 목록, name: images, widget: list, field: { label: URL, name: url, widget: string }, default: [] }
      - { label: 협찬 여부, name: sponsored, widget: boolean, default: false }
      - { label: 협찬 정보, name: sponsorInfo, widget: string, required: false }
      - { label: 제품 링크, name: productLink, widget: string, required: false }
      - { label: 네이버 URL, name: naverPostUrl, widget: string, required: false }
      - { label: 초안, name: draft, widget: boolean, default: true }
      - { label: 본문, name: body, widget: markdown }
